<head>

  <meta name="twitter:description" content="2026 book tour events for From Presence to Power — book launches, speaking engagements, and public appearances.">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img { height: auto; }

    :root {
      --orange:       #E55F1D;
      --brown:        #281D1D;
      --cream:        #EFEDEC;
      --cream-2:      #FCF1EB;
      --tan:          #DAD6CB;
      --fg:           #281D1D;
      --fg-muted:     #545452;
      --bg:           #EFEDEC;
      --border:       #DAD6CB;

      --font-display: "Big Shoulders Display", "Archivo Black", "Impact", sans-serif;
      --font-body:    "Inter", system-ui, sans-serif;
      --font-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", monospace;

      --ls-display:   -0.022em;
      --ls-eyebrow:   0.32em;
      --lh-display:   0.94;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    /* ── HERO ── */
    .events-hero {
      padding-top: 60px;
      background: var(--brown);
      display: flex;
      align-items: flex-end;
      min-height: 32vh;
    }

    .events-hero-left {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      padding: 48px 64px;
      gap: 48px;
    }

    .events-hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 20px;
    }

    .events-hero-title {
      font-family: var(--font-display);
      font-size: clamp(48px, 5vw, 72px);
      font-weight: 900;
      line-height: var(--lh-display);
      letter-spacing: var(--ls-display);
      text-transform: uppercase;
      color: var(--cream);
    }

    .events-hero-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(239,237,236,0.45);
      white-space: nowrap;
      padding-bottom: 8px;
    }

    .events-hero-right {
      background: var(--cream);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 64px;
    }

    .events-hero-desc {
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      color: var(--fg-muted);
      max-width: 400px;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #E55F1D 0%, #FF9A5C 100%);
      color: var(--cream);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 0;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      background: transparent;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 13px 28px;
      border-radius: 0;
      border: 1px solid var(--border);
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-secondary:hover { border-color: var(--fg); background: rgba(40,29,29,0.04); }

    /* ── EVENTS LIST ── */
    .events-section {
      padding: 80px 0;
    }

    .events-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 64px;
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 48px;
      display: block;
    }

    /* ── EVENT CARDS ── */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── EVENT CARDS ── */
    .he-card {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 0;
      align-items: stretch;
      border: 1px solid var(--border);
      margin-top: 10px;
      position: relative;
      background: transparent;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.18s;
      overflow: hidden;
    }
    .he-card:first-child { margin-top: 0; }
    .he-card--static { cursor: default; }

    .events-inquiry-text {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--fg-muted);
      margin-bottom: 16px;
      max-width: 560px;
      line-height: 1.6;
    }

    /* Date block — slightly darkened page bg */
    .he-card-date {
      background: #E2DED8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 28px 14px;
      text-align: center;
      flex-shrink: 0;
    }
    .he-card-month {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    .he-card-day {
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.01em;
      color: var(--fg);
      margin: 3px 0;
    }
    .he-card-day.range {
      font-size: 26px;
      line-height: 1.1;
    }
    .he-card-dow {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-top: 4px;
    }

    /* Card body */
    .he-card-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 28px;
      min-width: 0;
      gap: 3px;
    }

    /* City with pin */
    .he-card-city {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 5px;
    }
    .he-card-city svg { flex-shrink: 0; }

    /* Event title */
    .he-card-name {
      font-family: var(--font-display);
      font-size: clamp(18px, 1.9vw, 24px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--fg);
      margin: 0;
    }
    .he-card-name .name { color: var(--orange); }

    /* Single meta line: time • venue • address */
    .he-card-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-top: 7px;
      line-height: 1.55;
    }

    /* Host org line — for events where org ≠ venue */
    .he-card-host {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-top: 4px;
    }

    /* Right side — linked cards get the pill button */
    .he-card-action {
      display: flex;
      align-items: center;
      padding: 0 28px 0 16px;
      flex-shrink: 0;
    }
    .he-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--fg);
      color: var(--cream);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 11px 16px;
      white-space: nowrap;
    }

    /* Right side — static cards get the TBA tag */
    .he-card-tags {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      justify-content: center;
      padding: 0 28px 0 16px;
    }
    .he-card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--orange);
      color: var(--orange);
      white-space: nowrap;
    }

    /* Past events section */
    .past-events-section {
      display: none;
      border-top: 2px solid var(--border);
      margin-top: 0;
    }
    .past-events-header {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--fg-muted);
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }
    .past-events-list .he-card {
      opacity: 0.42;
      pointer-events: none;
    }

    /* Hidden — legacy classes no longer in markup */
    .he-card-arrow,
    .he-card-time,
    .he-card-location,
    .he-card-desc { display: none; }

    /* ── UPCOMING LABEL ── */
    .events-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 4px;
      display: block;
    }

    .events-heading {
      font-family: var(--font-display);
      font-size: clamp(36px, 4vw, 56px);
      text-transform: uppercase;
      letter-spacing: var(--ls-display);
      line-height: var(--lh-display);
      color: var(--fg);
      margin-bottom: 56px;
    }

    .events-ctas {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    /* ── PAST DIVIDER ── */
    .past-divider {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--fg-muted);
      opacity: 0.5;
      padding: 32px 0 0;
      display: block;
    }

    /* ── REACH OUT STRIP ── */
    .reach-out-strip {
      background: var(--orange);
    }
    .reach-out-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
    }
    .reach-out-content {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .reach-out-icon {
      flex-shrink: 0;
      color: rgba(239,237,236,0.7);
    }
    .reach-out-text {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--cream);
      line-height: 1.6;
      max-width: 560px;
    }
    .reach-out-btn {
      white-space: nowrap;
      flex-shrink: 0;
      border-color: rgba(239,237,236,0.4) !important;
      color: var(--cream) !important;
    }
    .reach-out-btn:hover {
      background: rgba(239,237,236,0.12) !important;
      border-color: var(--cream) !important;
    }

    /* ── EMAIL STRIP ── */
    .email-strip {
      background: var(--cream);
      border-top: 1px solid var(--border);
    }

    .email-strip-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
    }

    .es-copy { max-width: 480px; }

    .es-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase;
      color: var(--orange);
      display: block;
      margin-bottom: 12px;
    }

    .es-title {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.5vw, 36px);
      text-transform: uppercase;
      letter-spacing: var(--ls-display);
      line-height: var(--lh-display);
      color: var(--fg);
      margin-bottom: 8px;
    }

    .es-desc {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--fg-muted);
      line-height: 1.6;
    }

    .es-form {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .es-input {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px 20px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--fg);
      outline: none;
      width: 260px;
      transition: border-color 0.2s;
    }

    .es-input::placeholder { color: var(--fg-muted); }
    .es-input:focus { border-color: var(--orange); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .events-hero-left { padding: 40px 24px; flex-direction: column; align-items: flex-start; gap: 12px; }
      .events-hero-sub { white-space: normal; }
      .events-inner { padding: 0 24px; }
      .event-row { grid-template-columns: 1fr; gap: 8px; }
      .reach-out-inner { padding: 28px 24px; flex-direction: column; align-items: flex-start; gap: 20px; }
      .reach-out-content { gap: 16px; }
      .reach-out-icon { display: none; }
      .reach-out-btn { align-self: flex-start; }
      .email-strip-inner { flex-direction: column; align-items: flex-start; gap: 32px; padding: 48px 24px; }
      .es-form { flex-direction: column; width: 100%; }
      .es-input { width: 100%; }
      .footer-external { padding: 16px 24px; gap: 16px; }
      .he-card { grid-template-columns: 68px 1fr; }
      .he-card-date { padding: 16px 8px; grid-row: 1 / -1; }
      .he-card-day { font-size: 36px; }
      .he-card-body { padding: 16px 16px; }
      .he-card-name { font-size: 18px; }
      .he-card-action { display: none; }
      .he-card-tags { padding: 0 16px 16px; grid-column: 2; flex-direction: row; align-items: flex-start; justify-content: flex-start; margin-top: 0; }
      .he-card-meta { font-size: 10px; }
    }
    @media (max-width: 640px) {
    }

    /* ── FOOTER EXTERNAL LINKS ── */
    .footer-external {
      border-bottom: 1px solid var(--border);
      padding: 18px 64px;
      display: flex;
      gap: 32px;
      align-items: center;
      flex-wrap: wrap;
    }
    .footer-ext-link {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.18s;
    }
    .footer-ext-link:hover { color: var(--fg); }
  </style>

  <link rel="stylesheet" href="footer.css">

<body>

  <!-- NAV -->
  <nav id="site-nav"></nav>

  <div class="mobile-menu" id="site-mobile-menu" aria-hidden="true"></div>

  <main id="main-content">

  <!-- HERO -->
  <div class="events-hero">
    <div class="events-hero-left">
      <h1 class="events-hero-title">2026 Public<br>Events Calendar</h1>
    </div>
  </div>

  <!-- REACH OUT STRIP -->
  <div class="reach-out-strip">
    <div class="reach-out-inner">
      <div class="reach-out-content">
        <svg class="reach-out-icon" width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="20" height="16" stroke="currentColor" stroke-width="1.5"/>
          <polyline points="1,1 11,10 21,1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <p class="reach-out-text">Interested in organizing a book event, inviting Rashad to speak, partnering on sponsorships and workshops, or exploring other collaborations?</p>
      </div>
      <a href="https://www.rashadrobinson.com/contact" target="_blank" rel="noopener" class="btn-secondary reach-out-btn">Reach Out &rarr;</a>
    </div>
  </div>

  <!-- UPCOMING EVENTS -->
  <section class="events-section" id="upcoming">
    <div class="events-inner">

      <div class="events-list" id="upcoming-list"></div>

      <!-- PAST EVENTS -->
      <div class="past-events-section" id="past-events">
        <div class="past-events-header">Past Events</div>
        <div class="events-list past-events-list" id="past-events-list"></div>
      </div>

    </div>
  </section>


  <!-- EMAIL STRIP -->
  <div class="email-strip">
    <div class="email-strip-inner">
      <div class="es-copy">
        <span class="es-eyebrow">Stay Updated</span>
        <h2 class="es-title">More events coming soon</h2>
        <p class="es-desc">Sign up to stay in the loop.</p>
      </div>
      <form class="es-form" onsubmit="handleEventsSignup(event)">
        <input type="email" id="eventsEmail" class="es-input" placeholder="Your email address" aria-label="Email address" required>
        <button type="submit" class="btn-primary" id="eventsBtn">Notify Me</button>
      </form>
    </div>
  </div>

  </main>

  <!-- FOOTER -->
  <footer id="site-footer"></footer>

  <script>
    async function handleEventsSignup(e) {
      e.preventDefault();
      const email = document.getElementById('eventsEmail').value.trim();
      const btn = document.getElementById('eventsBtn');
      btn.disabled = true;
      btn.textContent = '...';
      try {
        await fetch('https://app.kit.com/forms/9529317/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email_address: email }),
          redirect: 'manual'
        });
        btn.closest('form').innerHTML = '<p style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--brown);">You\'re in — we\'ll be in touch.</p>';
      } catch (_) {
        btn.disabled = false;
        btn.textContent = 'Notify Me';
      }
    }
  </script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // EVENTS DATA
    //
    // To let the client manage events via Google Sheets:
    //   1. Create a Sheet with columns: date,city,title,meta,link
    //      (date = YYYY-MM-DD, link = full URL or leave blank)
    //   2. File → Share → Publish to web → Sheet1 → CSV → Publish
    //   3. Paste the published CSV URL into SHEET_CSV_URL below
    //
    // When SHEET_CSV_URL is set, the page fetches that CSV on load.
    // If the fetch fails, it falls back to the EVENTS array below.
    // When SHEET_CSV_URL is empty, only the EVENTS array is used.
    // ─────────────────────────────────────────────────────────────────────────

    var SHEET_CSV_URL = '';

    // Hardcoded fallback — also used when SHEET_CSV_URL is empty.
    // titleHtml: developer-authored HTML (allows orange <span class="name"> highlighting).
    // title:     plain-text fallback (used for sheet-loaded events).
    // meta:      plain text — time • venue • address (shown in mono under the title).
    // link:      RSVP/ticket URL. Empty = static card with no button.
    var EVENTS = [
      {
        id: 'global-black-economic-forum',
        date: '2026-07-03', month: 'Jul', day: '3', dow: 'Fri',
        city: 'New Orleans, LA',
        titleHtml: 'Panel with <span class="name">Senator Cory Booker</span>, <span class="name">Congresswoman Jasmine Crockett</span> &amp; <span class="name">Nicole Austin-Hillary</span>',
        meta: 'Fri 7/3 • Global Black Economic Forum @ Essence Fest • “Defining Power Against Ongoing Assaults”',
        link: 'https://gbef.com/events'
      },
      {
        id: 'jane-fonda',
        date: '2026-07-27', month: 'Jul', day: '27', dow: 'Mon',
        city: 'Manhattan, NY',
        titleHtml: 'Book Launch with <span class="name">Jane Fonda</span>',
        meta: 'MON 7/27 AT 7:00 PM • IFC CENTER • 323 6TH AVE, NEW YORK, NY 10014',
        link: 'https://www.ifccenter.com/films/from-presence-to-power-book-launch-rashad-robinson-in-conversation-with-jane-fonda/'
      },
      {

    // ── Helpers ──────────────────────────────────────────────────────────────

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    var PIN_SVG = '<svg width="9" height="12" viewBox="0 0 9 12" fill="none" aria-hidden="true"><path d="M4.5 0C2.01 0 0 2.01 0 4.5C0 7.88 4.5 12 4.5 12C4.5 12 9 7.88 9 4.5C9 2.01 6.99 0 4.5 0ZM4.5 6.08C3.67 6.08 3 5.41 3 4.58C3 3.75 3.67 3.08 4.5 3.08C5.33 3.08 6 3.75 6 4.58C6 5.41 5.33 6.08 4.5 6.08Z" fill="currentColor"/></svg>';

    function renderCard(ev) {
      var isRange = (ev.day + '').indexOf('–') > -1 || (ev.day + '').indexOf('-') > -1;
      var isLinked = !!ev.link;
      var hasDetails = !!ev.meta;

      var displayTitle = ev.titleHtml || esc(ev.title || '');

      var dateBlock = '<div class="he-card-date">'
        + '<span class="he-card-month">' + esc(ev.month) + '</span>'
        + '<span class="he-card-day' + (isRange ? ' range' : '') + '">' + esc(ev.day) + '</span>'
        + '<span class="he-card-dow">' + esc(ev.dow) + '</span>'
        + '</div>';

      var bodyBlock = '<div class="he-card-body">'
        + '<div class="he-card-city">' + PIN_SVG + esc(ev.city) + '</div>'
        + '<h3 class="he-card-name">' + displayTitle + '</h3>'
        + (ev.meta ? '<div class="he-card-meta">' + esc(ev.meta) + '</div>' : '')
        + '</div>';

      var rightBlock = isLinked
        ? '<div class="he-card-action"><span class="he-card-btn">View Event &rarr;</span></div>'
        : (!hasDetails
            ? '<div class="he-card-tags"><span class="he-card-tag">Details Coming Soon</span></div>'
            : '');

      var attrs = 'class="he-card' + (isLinked ? '' : ' he-card--static') + '" data-date="' + esc(ev.date) + '"'
        + (ev.id ? ' id="' + esc(ev.id) + '"' : '');

      if (isLinked) {
        return '<a href="' + esc(ev.link) + '" target="_blank" rel="noopener" ' + attrs + '>'
          + dateBlock + bodyBlock + rightBlock + '</a>';
      } else {
        return '<div ' + attrs + '>' + dateBlock + bodyBlock + rightBlock + '</div>';
      }
    }

    // ── CSV parser (for Google Sheets) ───────────────────────────────────────

    function parseCSV(text) {
      var lines = text.trim().split('\n');
      if (lines.length < 2) return [];
      var headers = lines[0].split(',').map(function(h) { return h.trim().replace(/^"|"$/g, ''); });

      function col(row, name) {
        var idx = headers.indexOf(name);
        if (idx < 0) return '';
        var v = (row[idx] || '').trim().replace(/^"|"$/g, '');
        return v;
      }

      // Quick CSV row splitter (handles quoted commas)
      function splitRow(line) {
        var result = [], cur = '', inQ = false;
        for (var i = 0; i < line.length; i++) {
          var c = line[i];
          if (c === '"') { inQ = !inQ; }
          else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
          else { cur += c; }
        }
        result.push(cur);
        return result;
      }

      return lines.slice(1).map(function(line) {
        var row = splitRow(line);
        var date = col(row, 'date');
        if (!date) return null;
        // Auto-derive month/day/dow from date string if not provided
        var parts = date.split('-');
        var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var rawTitle = col(row, 'title') || '';
        // [Name] bracket syntax → <span class="name"> for orange highlighting
        var titleHtml = esc(rawTitle).replace(/\[([^\]]+)\]/g, function(_, n) {
          return '<span class="name">' + n + '</span>';
        });
        return {
          id:        col(row, 'id'),
          date:      date,
          month:     col(row, 'month') || MONTHS[d.getMonth()],
          day:       col(row, 'day')   || String(d.getDate()),
          dow:       col(row, 'dow')   || DAYS[d.getDay()],
          city:      col(row, 'city'),
          title:     rawTitle,
          titleHtml: titleHtml,
          meta:      col(row, 'meta'),
          link:      col(row, 'link')
        };
      }).filter(Boolean);
    }

    // ── Render ───────────────────────────────────────────────────────────────

    function renderAll(events) {
      events = events.slice().sort(function(a, b) {
        return (a.date || '').localeCompare(b.date || '');
      });
      var today = new Date();
      today.setHours(0, 0, 0, 0);

      var upcomingList = document.getElementById('upcoming-list');
      var pastList     = document.getElementById('past-events-list');
      var pastSection  = document.getElementById('past-events');
      if (!upcomingList) return;

      var upcoming = [], past = [];
      events.forEach(function(ev) {
        var parts = ev.date.split('-');
        var evDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        if (evDate < today) {
          past.push(ev);
        } else {
          upcoming.push(ev);
        }
      });

      upcomingList.innerHTML = upcoming.map(renderCard).join('');
      if (past.length > 0) {
        pastList.innerHTML = past.map(renderCard).join('');
        pastSection.style.display = 'block';
      }
    }

    // ── Boot ─────────────────────────────────────────────────────────────────

    (function() {
      if (SHEET_CSV_URL) {
        fetch(SHEET_CSV_URL)
          .then(function(r) { return r.text(); })
          .then(function(text) { renderAll(parseCSV(text)); })
          .catch(function() { renderAll(EVENTS); }); // fall back on network error
      } else {
        renderAll(EVENTS);
      }
    })();
  </script>

  <script>
    // Scrolled nav state
    (function() {
      var navEl = document.querySelector('nav');
      if (!navEl) return;
      var SCROLL_THRESHOLD = 80;
      var lastState = false;
      function check() {
        var y = window.scrollY || window.pageYOffset || 0;
        var scrolled = y > SCROLL_THRESHOLD;
        if (scrolled !== lastState) { navEl.classList.toggle('scrolled', scrolled); lastState = scrolled; }
      }
      window.addEventListener('scroll', check, { passive: true });
      check();
    })();
  </script>
